[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subwatch"
version = "0.1.0"
description = "Find recurring subscriptions, price hikes and forgotten charges in bank and card CSV exports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["subscriptions", "banking", "csv", "personal-finance", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
subwatch = "subwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
